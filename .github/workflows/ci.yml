name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # serve's locks and autostart differ per OS
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The tests need no browser, no network, no Outlook account and no AI endpoint.
      - run: uv sync --frozen
      - run: uv run ruff check mailbrief tests demo scripts
      - run: uv run mypy mailbrief
      - run: uv run pytest -q
